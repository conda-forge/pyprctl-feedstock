schema_version: 1

context:
  name: pyprctl
  version: "0.1.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pyprctl-${{ version }}.tar.gz
  sha256: 1fb54d3ab030ec02e4afc38fb9662d6634c12834e91ae7959de56a9c09f69c26

build:
  number: 8
  skip: not linux
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python
    - setuptools >=40.9.0
    - wheel
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - pyprctl
      pip_check: true

about:
  summary: An interface to Linux's prctl() syscall written in pure Python using ctypes.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/cptpcrd/pyprctl

extra:
  recipe-maintainers:
    - jan-janssen
